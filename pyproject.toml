[project]
name = "stockpredict"
version = "0.1.0"
description = "Stock price exploration, transparent forecasts, and chronological backtests"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
