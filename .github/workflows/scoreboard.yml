name: Capture and score predictions

on:
  schedule:
    # Taipei 08:10, 08:30, 08:50: retry missing data while still before 09:00.
    - cron: "10,30,50 0 * * 1-5"
    # Taipei 15:30 / 17:30 / 21:30: collect newly published closes.
    - cron: "30 7,9,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-scoreboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -m stockpredict.scoreboard run --strict
        env:
          SCOREBOARD_DATABASE_URL: ${{ secrets.SCOREBOARD_DATABASE_URL }}
