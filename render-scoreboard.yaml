# Import separately from render.yaml; creating this cron service incurs Render charges.
services:
  - type: cron
    name: stockpredict-scoreboard-preopen
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # UTC. Router skips :10/:50 afternoon intersections without network requests.
    # Taipei: 08:10/08:30/08:50 preopen; 15:30/17:30/21:30 closes.
    schedule: "10,30,50 0,7,9,13 * * 1-5"
    dockerCommand: python -m stockpredict.scheduled_collection
    autoDeploy: false
    envVars:
      - key: SCOREBOARD_DATABASE_URL
        sync: false
